# Local PostgreSQL for development:  docker compose up -d db
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vita_care
    ports:
      - "5432:5432"
    volumes:
      - vita_care_pg:/var/lib/postgresql/data
volumes:
  vita_care_pg:
